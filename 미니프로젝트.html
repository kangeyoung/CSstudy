<style>
    .all {
        display: flex;

    .modal {

        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        /* 반투명 배경 */
        z-index: 1000;
    }

    .modal-content {
        background-color: white;
        width: 450px;
        /* 첫 구현보다 약간 넓게 */
        min-height: 650px;
        /* 세로 크기 크게 증가 */
        padding: 30px;
        border-radius: 10px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
    }

    .birthdate {
        display: flex;
        gap: 10px;
    }

    #result {
        margin-top: 20px;
    }

    .modal-content h3 {
        margin: 0 0 30px;
        text-align: center;
        font-size: 24px;
    }

    .modal-content form {
        display: flex;
        flex-direction: column;
        gap: 20px;
        /* 입력 필드 간격 넓힘 */
        flex-grow: 1;
    }

    .modal-content input,
    .modal-content select {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }

    .modal-content button {
        padding: 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .check-duplicate {
        border: 1px black;
        border-width: 3px;
    }

    .birthdate {
        display: flex;
        gap: 10px;
    }

    .birthdate select {
        flex: 1;
    }

    .modal-content button {
        border: 1px solid rgb(199, 189, 189);
    }
</style>

<body>

    function birth() {
        const yearSelect = document.querySelector('#birth-year');
        const monthSelect = document.querySelector('#birth-month');
        const daySelect = document.querySelector('#birth-day');

        // 년 (1960-2010)
        for (let y = 2010; y >= 1960; y--) {
            const option = document.createElement('option');
            option.value = y;
            option.text = y;
            yearSelect.appendChild(option);
        }

        // 월 (1-12)
        for (let m = 1; m <= 12; m++) {
            const option = document.createElement('option');
            option.value = m.toString().padStart(2, '0');
            option.text = m;
            monthSelect.appendChild(option);
        }

        // 일 (1-31, 동적 조정)
        function updateDays() {
            daySelect.innerHTML = '<option value="">일</option>';
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            if (!year || !month) return;

            const daysInMonth = new Date(year, month, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const option = document.createElement('option');
                option.value = d.toString().padStart(2, '0');
                option.text = d;
                daySelect.appendChild(option);
            }
        }

        yearSelect.addEventListener('change', updateDays);
        monthSelect.addEventListener('change', updateDays);
    }
    birth();

    const modal = document.querySelector('#signup-modal');
    document.querySelector('#signin').addEventListener('click', () => {
        modal.style.display = 'block';
    });
    document.querySelector('#modal-close').addEventListener('click', () => {
        modal.style.display = 'none';
        signUpFlag = false;
        document.querySelector('#signup-form').reset();
