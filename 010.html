<script>
    let list = new Array();
    list.unshift(["","",""])            
    window.onload = ()=>{
        document.getElementById('save').addEventListener('click',()=>{
            let word = document.getElementById('word');
            let tp = document.getElementById('tp');
            let des = document.getElementById('des');
            if(word.value == "" || tp.value == "" || des.value == ""){
                alert("빈칸");
                return;
            }            
            let str = des.value;
            if(str.length>6){
                str = str.substring(0,5); 
            }
            let num = list.length
            // list.push([num ,tp.value, word.value, str]); 배열 맨 뒤에 값 넣기
            list.unshift([tp.value,word.value,str]); // 배열 맨 앞에 값 넣기
            onloadTable(0);            
            // tp.value = "";
            // word.value = "";
            // des.value = "";                       
        })
        document.getElementById('selectAll').addEventListener('click',()=>{            
            const checkboxes = document.getElementsByName("check");
            checkboxes.forEach((checkbox) => {
                checkbox.checked = true;
            })
        })
        document.getElementById('del').addEventListener('click',()=>{
            const table = document.getElementById('printtable');
            for(let i = 1; i<6 ;i++){
                let chkbox = table.rows[i].cells[0].childNodes[0];
                console.log(chkbox);
                if(chkbox == undefined){
                    continue;
                }else if(chkbox.checked){                   
                    let delnum =table.rows[i].cells[1].childNodes[0];
                    list.splice((list.length-delnum),1);
                    for(let j = 0; j<5;j++){
                        table.rows[i].cells[j].innerHTML = "";
                    }                                       
                }
            }
            onloadTable(0);
        })   

    }
    function onloadTable(n){
        console.log(n);
        let table = document.getElementById('printtable');
        let num = list.length-(5*n)
        for(let i = 1; i<6; i++){
            for(let j = 0; j<5;j++){
                    table.rows[i].cells[j].innerHTML = "";
            }   
        }        
        for(let i = 1; i<6 && i<num ; i++){
            table.rows[i].cells[0].innerHTML = '<input type = checkbox name = check>';
            table.rows[i].cells[1].innerHTML = i+5*n;
            table.rows[i].cells[2].innerHTML = list[i+5*n-1][0];
            table.rows[i].cells[3].innerHTML = list[i+5*n-1][1];
            table.rows[i].cells[4].innerHTML = list[i+5*n-1][2];
        }
        table.rows[6].cells[1].innerHTML = makePage(list.length);
    }
    function makePage(m){
        let totalPage = m-2;
        let page = Math.floor(totalPage/5);
        let returnHTML = "";
        console.log("t "+ totalPage);
        console.log("p "+page);
        for(let i = 0; i<=page; i++){
            returnHTML += `<span id = page onclick = onloadTable(${i})>[${i+1}]</span>`
        }
        return returnHTML;
    }

    
</script>
