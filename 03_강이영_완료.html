<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .all{
        display: flex;
        justify-content: center;
        gap: 10px;        
    }
    #header{
        background-color: cornflowerblue;
        color: white;
        width: 850px;
        text-align: center;
        padding: 20px;
        font-size: 20px;
    }
    .content{
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    .ins span{
        font-size: 20px;
    }
    .ins input[type = text]{
        border: 2px solid;
        border-color: cornflowerblue;
        height: 20px;
    }
    .ins input[type = button]{
        background-color: cornflowerblue;
        color: white;
        border: transparent;
        width: 55px;
        height: 30px;
        font-size: 15px;
    }    
    #subheader{
        background-color: cornflowerblue;
        color: white;
        width: 210px;
        padding: 20px;
        font-size: 20px;
        text-align: center;
        margin-bottom: 0px;
    }
    #sub, #checkSub, #req{
        padding: 30px 0px;
        padding-left: 100px;        
        border: 1px solid;
        border-color: cornflowerblue;
        margin-top: 0px;
        height: 180px;
    }
    .btns{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0px;
    }
    .btns input[id = input], .btns input[id = output]{
        background-color: cornflowerblue;
        color: white;
        border: transparent;
        width: 50px;
        height: 30px;
        font-size: 20px;
        padding: 5px;        
    }
    .btns input[id = submit]{
        background-color: cornflowerblue;
        color: white;
        border: transparent;
        width: 50px;
        height: 100px;
        font-size: 20px;
        padding: 5px;
        writing-mode: vertical-lr;       
    }
</style>
<body>
    <div class = "all">
        <h2 id = "header">수강신청프로그램</h2>
    </div>
    <div class = "content">
        <div class = "ins">
            <span>교과목 등록</span> <br>
            &emsp;
            <span>교과목</span> <input type = text id = subject style = "width: 200px;"> 
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <span>강의실</span> <input type = text id = room style = "width: 100px;">
            <span>교수명</span> <input type = text id = teacher style = "width: 100px;">
            <input type = button id = insert value = 등록 onclick = insert()>
        </div>
    </div>
    <div class = "all">
        <div class = "tt">
            <h2 id = "subheader">교과목</h2>
            <p id = "sub">
                
            </p>
        </div>
        <div class = "btns">
            <input type = button id = input value = '>>' onclick = input()><br>
            <input type = button id = output value = '<<' onclick = output()>
        </div>
        <div class = "tt">
            <h2 id = "subheader">선택한 교과목</h2>
            <p id = "checkSub">

            </p>
        </div>
        <div class = "btns">
            <input type = button id = submit value = 결과확인 onclick = submitS()>
        </div>
        <div class = "tt">
            <h2 id = "subheader">신청내역</h2>
            <p id = "req">
                
            </p>
        </div>
    </div>
</body>
</html>
<script>
    let subjectList = new Array();
    let checkList = new Array();
    function insert(){
        let a = document.getElementById('subject');
        let b = document.getElementById('room');
        let c = document.getElementById('teacher');
        let subject = new Subject(a.value, b.value, c.value);
        a.value = "";
        b.value = "";
        c.value = "";
        if(!dupSub(subject.name)){
            subjectList.push(subject);
            onloadSub();
        }        
    }

    function submitS(){
        let check = document.querySelectorAll('#checkSub input[type = checkbox]:checked');
        if(check.length == 0){
            alert('선택 안함');
            return;
        }
        let submitText = document.getElementById('req')
        for(let i = 0; i<check.length;i++){
            let str = document.querySelectorAll('#checkSub label')[check[i].id-10].innerHTML;
            let chkSub = returnSub(str);
            submitText.innerHTML += `${i+1}. ${chkSub.name} <br>`;
        }
    }
    
    function input(){
        let check = document.querySelectorAll('#sub input[type = checkbox]:checked');
        if(check.length == 0){
            alert('선택 안함')
            return;
        }              
        for(let i = 0; i<check.length; i++){
            let str = document.querySelectorAll('#sub label')[check[i].id].innerHTML;
            if(!dupChkSub(str)){          
                let chkSub = returnSub(str);
                console.log(chkSub);                
                checkList.push(chkSub);
            }
            check[i].checked = false;                            
        }                        
        onloadcheckSub();
    }

    function output(){
        let check = document.querySelectorAll('#checkSub input[type = checkbox]:checked');
        if(check.length == 0){
            alert('선택 안함')
            return;
        }               
        for(let i = 0; i<check.length; i++){
            let str = document.querySelectorAll('#checkSub label')[check[i].id-10].innerHTML;
            let chkSub = returnSub(str);                
            checkList.splice(checkList.indexOf(chkSub),1);
            check[i].checked = false;      
        }                          
        onloadcheckSub();         
    }

    function dupSub(str){
        for(let i = 0; i<subjectList.length;i++){
            if(subjectList[i].name == str){
                return true;
            }
        }
        return false;
    }

    function dupChkSub(str){
        for(let i = 0; i<checkList.length;i++){
            if(checkList[i].name == str){
                return true;
            }
        }
        return false;
    }

    function returnSub(str){
        for(let i = 0; i<subjectList.length;i++){
            if(subjectList[i].name == str){                
                return subjectList[i];
            }
        }
    }

    function onloadcheckSub(){
        let chkSubText = document.getElementById('checkSub');
        chkSubText.innerHTML = "";
        let number = 10;
        checkList.forEach((subject)=>{
            let name = subject.name;
            chkSubText.innerHTML += `<input type = checkbox id = ${number}><label for = ${number}>${name}</label><br>`
            number++;
        })
    }

    function onloadSub(){
        let subText = document.getElementById('sub');
        subText.innerHTML = "";
        let number = 0;
        subjectList.forEach((subject)=>{
            let name = subject.name;
            subText.innerHTML += `<input type = checkbox id = ${number}><label for = ${number}>${name}</label><br>`
            number++;
        })
    }

    class Subject{
        constructor(name, room, teacher){
            this.name = name;
            this.room = room;
            this.teacher = teacher;
        }             
    }
</script>
